<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عدّاد شهر رمضان 🌙</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:radial-gradient(circle at 50% -10%,#20355c 0%,#0d1526 45%,#05070d 100%);
    color:#f2f5ff;
  }
  .card{
    width:min(680px,100%);text-align:center;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(245,196,81,.25);
    border-radius:24px;padding:36px 24px 28px;
    box-shadow:0 25px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(8px);
  }
  .moon{font-size:56px;filter:drop-shadow(0 0 22px rgba(245,196,81,.65));animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  h1{font-size:clamp(20px,4.5vw,30px);margin:14px 0 6px;color:#f5c451;font-weight:700}
  .sub{color:#9fb0cc;font-size:clamp(13px,3vw,16px);margin-bottom:24px;line-height:1.7}
  .timer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 18px}
  .unit{
    background:linear-gradient(180deg,rgba(245,196,81,.14),rgba(245,196,81,.03));
    border:1px solid rgba(245,196,81,.22);border-radius:16px;padding:14px 6px;
  }
  .num{display:block;font-size:clamp(24px,7vw,40px);font-weight:800;
       font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(245,196,81,.35)}
  .lbl{display:block;margin-top:6px;font-size:12px;color:#9fb0cc;letter-spacing:.5px}
  .bar-wrap{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 18px}
  .bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#e0a020,#f5c451);transition:width .6s}
  .note{font-size:12px;color:#7d8ba6;line-height:1.8;border-top:1px solid rgba(255,255,255,.08);padding-top:14px;margin-top:6px}
  @media(max-width:420px){.timer{gap:8px}.unit{padding:10px 2px}}
</style>
</head>
<body>

<div class="card">
  <div class="moon">🌙</div>
  <h1 id="title">جارٍ الحساب…</h1>
  <p class="sub" id="sub"></p>

  <div class="timer">
    <div class="unit"><span class="num" id="d">0</span><span class="lbl">يوم</span></div>
    <div class="unit"><span class="num" id="h">0</span><span class="lbl">ساعة</span></div>
    <div class="unit"><span class="num" id="m">0</span><span class="lbl">دقيقة</span></div>
    <div class="unit"><span class="num" id="s">0</span><span class="lbl">ثانية</span></div>
  </div>

  <div class="bar-wrap" id="barWrap" hidden><div class="bar" id="bar"></div></div>

  <p class="note">التاريخ محسوب حسب تقويم أم القرى، وقد يختلف يوم أو يومين عن الرؤية الشرعية في بلدك.</p>
</div>

<script>
/* ===== أدوات التقويم الهجري ===== */
const hijriFmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {
  day: 'numeric', month: 'numeric', year: 'numeric', timeZone: 'UTC'
});
const DAY = 86400000;

function hijriParts(date) {
  const o = {};
  for (const p of hijriFmt.formatToParts(date)) o[p.type] = p.value;
  return { day: +o.day, month: +o.month, year: +o.year };
}
// تاريخ اليوم نفسه بساعة 12:00 UTC (تجنّباً لمشاكل التوقيت الصيفي)
function utcNoon(date) {
  return new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12));
}
function shiftDays(date, n) {
  const d = new Date(date);
  d.setUTCDate(d.getUTCDate() + n);
  return d;
}
function isFirstOfMonth(date, month) {
  const h = hijriParts(date);
  return h.month === month && h.day === 1;
}
// يبحث عن أول يوم من شهر هجري معيّن (9 = رمضان، 10 = شوال)
function findMonthStart(from, month, dir) {
  let d = from;
  for (let i = 0; i < 800; i++) {
    if (isFirstOfMonth(d, month)) return d;
    d = shiftDays(d, dir);
  }
  return null;
}
function localMidnight(utcNoonDate) {
  return new Date(utcNoonDate.getUTCFullYear(), utcNoonDate.getUTCMonth(), utcNoonDate.getUTCDate());
}

/* ===== الحساب ===== */
function computeData(now) {
  const today = utcNoon(now);

  // بداية رمضان الحالية (أو الماضية) + عيد الفطر اللي بعدها
  const ramadanStart = findMonthStart(today, 9, -1);
  const eidFitr = ramadanStart ? findMonthStart(shiftDays(ramadanStart, 1), 10, 1) : null;
  const inRamadan = ramadanStart && eidFitr && today >= ramadanStart && today < eidFitr;

  if (inRamadan) {
    const dayNum = Math.round((today - ramadanStart) / DAY) + 1;
    const year = hijriParts(ramadanStart).year;
    const startLocal = localMidnight(ramadanStart);
    const endLocal = localMidnight(eidFitr);
    return {
      mode: 'during',
      target: endLocal,
      startLocal,
      endLocal,
      title: `اليوم ${dayNum} من شهر رمضان ${year} هـ`,
      sub: 'باقي على عيد الفطر 🌟'
    };
  }

  // أقرب رمضان جاي
  const nextStart = findMonthStart(today, 9, 1);
  const year = hijriParts(nextStart).year;
  const startLocal = localMidnight(nextStart);
  const dateStr = startLocal.toLocaleDateString('ar-IQ', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

  return {
    mode: 'before',
    target: startLocal,
    title: `باقي على شهر رمضان ${year} هـ`,
    sub: `يتوقع أن يبدأ يوم ${dateStr} إن شاء الله`
  };
}

/* ===== الواجهة ===== */
const el = {
  title: document.getElementById('title'),
  sub: document.getElementById('sub'),
  d: document.getElementById('d'),
  h: document.getElementById('h'),
  m: document.getElementById('m'),
  s: document.getElementById('s'),
  barWrap: document.getElementById('barWrap'),
  bar: document.getElementById('bar')
};

const pad = n => String(n).padStart(2, '0');
let data = null;
let lastKey = '';

function renderStatic(now) {
  data = computeData(now);
  el.title.textContent = data.title;
  el.sub.textContent = data.sub;
  el.barWrap.hidden = data.mode !== 'during';
}

function tick() {
  const now = new Date();
  const key = now.toDateString();

  // نعيد الحساب مرة واحدة كل يوم فقط (تخفيف الضغط)
  if (key !== lastKey) {
    lastKey = key;
    renderStatic(now);
  }

  let ms = data.target - now;
  if (ms < 0) ms = 0;
  const total = Math.floor(ms / 1000);

  el.d.textContent = Math.floor(total / 86400);
  el.h.textContent = pad(Math.floor((total % 86400) / 3600));
  el.m.textContent = pad(Math.floor((total % 3600) / 60));
  el.s.textContent = pad(total % 60);

  if (data.mode === 'during') {
    const span = data.endLocal - data.startLocal;
    const done = Math.min(1, Math.max(0, (now - data.startLocal) / span));
    el.bar.style.width = (done * 100).toFixed(2) + '%';
  }
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
