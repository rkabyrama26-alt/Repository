<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العد التنازلي لرمضان 2027</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            color: #f39c12;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            min-width: 90px;
            border: 1px solid #f39c12;
        }

        .time-box span {
            display: block;
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
        }

        .time-box p {
            font-size: 0.9rem;
            color: #ddd;
            margin-top: 5px;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌙 العد التنازلي لرمضان 2027 🌙</h1>
        <div class="countdown" id="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <p>يوم</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>ساعة</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>دقيقة</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>ثانية</p>
            </div>
        </div>
        <div class="footer-note" id="note">اللهم بلغنا رمضان لا فاقدين ولا مفقودين</div>
    </div>

    <script>
        // تحديد تاريخ بداية رمضان 2027 (تاريخ تقديرياً 8 فبراير 2027، ويمكن تعديله لاحقاً حسب الرؤية)
        const ramadanDate = new Date("Feb 8, 2027 00:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = ramadanDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "<h2>مبارك عليكم الشهر الفضيل!</h2>";
                document.getElementById("note").style.display = "none";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }, 1000);
    </script>

</body>
</html>
